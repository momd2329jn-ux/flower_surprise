<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Flower For You</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #32152e, #080510);
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    position: relative;
    width: 100%;
}

h2 {
    color: pink;
    margin-bottom: 70px;
    letter-spacing: 2px;
}

.envelope {
    position: relative;
    width: 280px;
    height: 180px;
    background: #c94f83;
    cursor: pointer;
    border-radius: 5px;
    margin: auto;
    box-shadow: 0 0 30px #ff69b455;
}

.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 110px solid #ed9fbd;
    transform-origin: top;
    transition: 1s;
    z-index: 5;
}

.envelope.open::before {
    transform: rotateX(180deg);
    z-index: 0;
}

.envelope::after {
    content: "❤️";
    position: absolute;
    top: 75px;
    left: 125px;
    font-size: 30px;
    z-index: 6;
    transition: 0.5s;
}

.envelope.open::after {
    opacity: 0;
}

.letter {
    position: absolute;
    width: 240px;
    height: 150px;
    background: #fff0f5;
    left: 20px;
    bottom: 0;
    border-radius: 5px;
    transition: 1s;
    z-index: 1;
}

.envelope.open .letter {
    transform: translateY(-150px);
}

.flower {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translate(-50%, 0) scale(0);
    transition: 1.5s;
    z-index: 4;
    font-size: 100px;
    filter: drop-shadow(0 0 20px #ff477e);
}

.envelope.open .flower {
    transform: translate(-50%, -180px) scale(1);
}

/* Motivational message window */
.message-box {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 20;
}

.message-box.show {
    display: flex;
}

.message-content {
    background: linear-gradient(145deg, #fff0f5, #f8d4e5);
    color: #753653;
    padding: 28px 22px;
    border-radius: 20px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 0 35px #ff8cbb77;
    animation: appear 0.6s ease;
}

@keyframes appear {
    from {
        transform: scale(0.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.message-content h3 {
    color: #b83270;
    font-size: 23px;
}

.message-content p {
    line-height: 2;
    font-size: 16px;
}

.close-btn {
    background: #c94f83;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 12px;
}

.close-btn:hover {
    background: #a52d65;
}

</style>
</head>

<body>

<div class="container">

<h2>A SPECIAL SURPRISE FOR YOU 💌</h2>

<div class="envelope" id="envelope"
     onclick="openEnvelope()">

    <div class="letter"></div>

    <div class="flower">🌹</div>

</div>

</div>

<!-- Motivational message -->
<div class="message-box" id="messageBox">

    <div class="message-content">

        <h3>أنت أقوى مما تتخيل! 🌟</h3>

        <p>
        لا تستسلم مهما كانت الطريق صعبة،
        فكل خطوة صغيرة تخطوها اليوم
        تقرّبك من حلمك غداً.
        <br><br>

        ثق بنفسك، آمن بقدراتك،
        واستمر بالسعي، فالأشياء الجميلة
        تحتاج صبراً واجتهاداً.
        <br><br>

        <strong>
        تذكّر دائماً:
        نجاحك يبدأ من إيمانك بنفسك. ❤️
        </strong>
        </p>

        <button class="close-btn"
                onclick="closeMessage()">
            إغلاق الرسالة ✕
        </button>

    </div>

</div>

<script>

let opened = false;

function openEnvelope() {

    if (opened) return;

    opened = true;

    document.getElementById("envelope")
    .classList.add("open");

    setTimeout(function() {

        document.getElementById("messageBox")
        .classList.add("show");

    }, 2500);

}

function closeMessage() {

    document.getElementById("messageBox")
    .classList.remove("show");

}

</script>

</body>
</html>
